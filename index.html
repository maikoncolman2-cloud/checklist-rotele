<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DPO ARMAZÉM · Rotele</title>
<meta name="description" content="Checklists, produtividade, planos de ação, projetos e auditoria DPO do Armazém Rotele">
<meta name="theme-color" content="#1f2a37">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DPO Armazém">
<style>
  :root { --bg:#1f2a37; --fg:#fff; --acc:#e8650a; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  #app { position:fixed; inset:0; top:env(safe-area-inset-top); width:100%; height:calc(100% - env(safe-area-inset-top)); border:0; background:#f3f4f6; }
  #bar { position:fixed; left:0; right:0; bottom:0; padding:8px 12px calc(8px + env(safe-area-inset-bottom)); display:none;
         background:rgba(31,42,55,.96); font-size:14px; align-items:center; gap:10px; justify-content:space-between; z-index:5; }
  #bar a, #bar button { color:#fff; background:var(--acc); border:0; border-radius:8px; padding:8px 12px; font-size:14px; text-decoration:none; }
  #bar button.sec { background:transparent; border:1px solid #fff6; }
  #off { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center; }
  #off img { width:96px; height:96px; border-radius:20px; }
  #off button { color:#fff; background:var(--acc); border:0; border-radius:10px; padding:12px 18px; font-size:16px; }
  #inst { position:fixed; left:0; right:0; top:0; z-index:6; display:none; gap:10px; align-items:center; justify-content:space-between;
          padding:calc(8px + env(safe-area-inset-top)) 12px 8px; background:var(--bg); border-bottom:3px solid var(--acc); font-size:14px; line-height:1.3; }
  #inst b { color:#ffb37a; }
  #inst .bt { display:flex; gap:8px; flex-shrink:0; }
  #inst a, #inst button { color:#fff; background:var(--acc); border:0; border-radius:8px; padding:9px 12px; font-size:14px; text-decoration:none; white-space:nowrap; }
  #inst button.sec { background:transparent; border:1px solid #fff6; }
</style>
</head>
<body>
<iframe id="app" title="DPO ARMAZÉM · Rotele"
  src="https://script.google.com/macros/s/AKfycbyDMg4dCZfnVDDl7akjABRWY-OPuleOcErR9C2hIIt4nr_XA2EPekQZjqHl6xeDn7HtLg/exec"
  allow="geolocation *; camera *; clipboard-write *"
  allowfullscreen></iframe>

<div id="bar">
  <span>Não carregou ou a câmera/localização não abre?</span>
  <span>
    <a id="abrir" target="_blank" rel="noopener" href="https://script.google.com/macros/s/AKfycbyDMg4dCZfnVDDl7akjABRWY-OPuleOcErR9C2hIIt4nr_XA2EPekQZjqHl6xeDn7HtLg/exec">Abrir no navegador</a>
    <button class="sec" onclick="document.getElementById('bar').style.display='none'">Fechar</button>
  </span>
</div>

<div id="inst">
  <span id="instTxt"></span>
  <span class="bt">
    <button id="instBtn" style="display:none">Instalar app</button>
    <a id="instChrome" style="display:none" href="intent://maikoncolman2-cloud.github.io/checklist-rotele/#Intent;scheme=https;package=com.android.chrome;end">Abrir no Chrome</a>
    <button class="sec" id="instFechar">Agora não</button>
  </span>
</div>

<div id="off">
  <img src="icon-192.png" alt="">
  <strong>Sem conexão com a internet</strong>
  <span>O checklist precisa de internet para registrar no sistema. Verifique o Wi-Fi ou os dados móveis.</span>
  <button onclick="location.reload()">Tentar de novo</button>
</div>

<script>
  // Sem conexão: mostra aviso (o app não funciona offline).
  function rede() {
    var on = navigator.onLine;
    document.getElementById('off').style.display = on ? 'none' : 'flex';
    document.getElementById('app').style.display = on ? 'block' : 'none';
  }
  addEventListener('online', function(){ location.reload(); });
  addEventListener('offline', rede);
  rede();
  // Mostra o atalho "Abrir no navegador" por alguns segundos e sempre que o app demorar a carregar.
  var bar = document.getElementById('bar'), carregou = false;
  document.getElementById('app').addEventListener('load', function(){ carregou = true; });
  setTimeout(function(){ bar.style.display = 'flex'; setTimeout(function(){ if (carregou) bar.style.display = 'none'; }, 8000); }, carregou ? 0 : 12000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});

  // Faixa "Instalar app": aparece só quando o app ainda não está instalado (aberto no navegador).
  (function () {
    var ua = navigator.userAgent || '';
    var apkV = Number((location.search.match(/[?&]apk=(\d+)/) || [])[1] || 0);   // aberto pelo app Android (APK)
    var instalado = apkV > 0 || matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    var apkLink = ' — ou <a href="apk/dpo-armazem-rotele.apk" style="background:none;padding:0;color:#ffb37a;text-decoration:underline">baixe o app Android (APK)</a>';
    if (apkV > 0) {
      // APK instalado: o conteúdo atualiza sozinho (vem do servidor). Só avisa quando o próprio APK tiver versão nova.
      fetch('versao-apk.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (v) {
        if (Number(v.versionCode) > apkV) {
          var inst = document.getElementById('inst'); document.getElementById('instTxt').innerHTML = 'Nova versão do app Android (<b>' + v.versionName + '</b>). ' + (v.novidades || '');
          var a = document.getElementById('instChrome'); a.href = v.arquivo; a.textContent = 'Atualizar'; a.style.display = ''; inst.style.display = 'flex';
          document.getElementById('instFechar').onclick = function () { inst.style.display = 'none'; };
        }
      }).catch(function () { });
    }
    if (instalado) return;
    var inst = document.getElementById('inst'), txt = document.getElementById('instTxt');
    var btn = document.getElementById('instBtn'), chrome = document.getElementById('instChrome');
    var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);
    var android = /Android/i.test(ua);
    var interno = /WhatsApp|Instagram|FBAN|FBAV|FB_IAB|Line\/|; wv\)/i.test(ua); // navegador interno de outro app
    var iosOutro = ios && /CriOS|FxiOS|EdgiOS/i.test(ua);                        // iPhone fora do Safari
    function mostra(html) {
      txt.innerHTML = html; inst.style.display = 'flex';
      document.getElementById('app').style.top = inst.offsetHeight + 'px';
      document.getElementById('app').style.height = 'calc(100% - ' + inst.offsetHeight + 'px)';
    }
    function esconde() { inst.style.display = 'none'; document.getElementById('app').style.top = ''; document.getElementById('app').style.height = ''; }
    document.getElementById('instFechar').onclick = esconde;
    if (interno) {
      if (android) { chrome.style.display = ''; mostra('Para <b>instalar</b>, abra no <b>Chrome</b> (ou toque em ⋮ → "Abrir no navegador").'); }
      else mostra('Para <b>instalar</b>, abra no <b>Safari</b>: toque em ••• ou no ícone da bússola → "Abrir no Safari".');
      return;
    }
    if (ios) {
      mostra(iosOutro ? 'Para <b>instalar</b> no iPhone, abra este endereço no <b>Safari</b>.'
                      : 'Para <b>instalar</b>: toque em <b>Compartilhar</b> (□↑) → <b>Adicionar à Tela de Início</b> → Adicionar.');
      return;
    }
    var evento = null;
    addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault(); evento = e; btn.style.display = '';
      mostra('Instale o <b>DPO Armazém</b> na tela do celular' + apkLink + '.');
    });
    btn.onclick = function () { if (!evento) return; evento.prompt(); evento.userChoice.then(function () { evento = null; esconde(); }); };
    addEventListener('appinstalled', esconde);
    if (android) setTimeout(function () { if (!evento) mostra('Para <b>instalar</b>: menu <b>⋮</b> → <b>Instalar app</b> (ou "Adicionar à tela inicial")' + apkLink + '.'); }, 4000);
  })();
</script>
</body>
</html>
